# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    
    groups:
      # Group the egui frontend ecosystem and native file dialogs
      gui-and-frontend:
        patterns:
          - "egui*"
          - "eframe*"
          - "rfd*"

      # Group Hugging Face and Candle ML frameworks to prevent version mismatches
      machine-learning:
        patterns:
          - "candle-*"
          - "hf-hub*"

      # Group heavy graphics, metadata, and parallel processing crates
      image-and-processing:
        patterns:
          - "image*"
          - "kamadak-exif*"
          - "rawloader*"
          - "rayon*"

      # Group serialization and database storage tools
      data-and-storage:
        patterns:
          - "serde*"
          - "rusqlite*"

      # Group core utilities (hashing, time, error-handling)
      utilities:
        patterns:
          - "anyhow*"
          - "chrono*"
          - "blake3*"

  # Optional but recommended: keeps your GitHub Actions workflows updated
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
