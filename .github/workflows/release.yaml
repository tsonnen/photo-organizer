name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
      - '*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: photo_organizer
            asset_name: photo_organizer-linux-x86_64
            archive_name: photo_organizer-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: photo_organizer.exe
            asset_name: photo_organizer-windows-x86_64.exe
            archive_name: photo_organizer-windows-x86_64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary (Linux)
        if: runner.os == 'Linux'
        run: |
          cd target/${{ matrix.target }}/release
          cp ${{ matrix.binary_name }} ${{ matrix.asset_name }}
          tar -czf ${{ matrix.archive_name }} ${{ matrix.binary_name }}
          cp ${{ matrix.asset_name }} ${{ github.workspace }}/
          cp ${{ matrix.archive_name }} ${{ github.workspace }}/

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Copy-Item ${{ matrix.binary_name }} -Destination ${{ matrix.asset_name }}
          Compress-Archive -Path ${{ matrix.binary_name }} -DestinationPath ${{ matrix.archive_name }}
          Copy-Item ${{ matrix.asset_name }} -Destination ${{ github.workspace }}
          Copy-Item ${{ matrix.archive_name }} -Destination ${{ github.workspace }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: photo_organizer-${{ matrix.target }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.archive_name }}
          retention-days: 14

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
