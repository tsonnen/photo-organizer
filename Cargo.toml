[package]
name = "photo_organizer"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.27"
egui = "0.27"
rfd = "0.17"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
hf-hub = "1.0"
image = "0.24"
kamadak_exif = {package = "kamadak-exif", version = "0.5" }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
blake3 = "1.5"
rawloader = "0.37"
rayon = "1.10"
